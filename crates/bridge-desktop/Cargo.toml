[package]
name = "bridge-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:security-framework"]

[[bin]]
name = "bridge-desktop"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
bridge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sqlx.workspace = true
url.workspace = true
axum.workspace = true
zeroize.workspace = true
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
