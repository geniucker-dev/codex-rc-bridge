<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Server deployment: access to the management page</title><desc id="desc">The browser uses HTTPS to reach Caddy or nginx on the host. The proxy terminates TLS and forwards HTTP to the bridge container through 127.0.0.1:8787 on the host. The bridge container does not obtain certificates.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1e2a33}.title{font-size:30px;font-weight:650}.sub{font-size:18px;fill:#5b6b77}.label{font-size:16px;font-weight:600;fill:#236778}.name{font-size:25px;font-weight:600}.body{font-size:18px}.small{font-size:14px;fill:#5b6b77}.pill{font-size:16px;fill:#236778}.card{fill:white;stroke:#d8e0e5;stroke-width:1.5}.wire{fill:none;stroke:#236778;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236778"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f7f8"/><text x="36" y="49" class="title" text-anchor="start">Server deployment: access to the management page</text><text x="36" y="80" class="sub" text-anchor="start">Your host reverse proxy handles HTTPS and certificates.</text><rect x="300" y="111" width="664" height="243" rx="12" fill="#eaf0f3"/><text x="324" y="141" class="label" text-anchor="start">Your server host</text><rect x="36" y="166" width="213" height="144" rx="12" class="card"/><text x="142" y="210" class="name" text-anchor="middle">Browser</text><text x="142" y="247" class="body" text-anchor="middle">Management page</text><text x="142" y="280" class="small" text-anchor="middle">bridge.example.com</text><rect x="330" y="166" width="235" height="144" rx="12" class="card"/><text x="447" y="204" class="label" text-anchor="middle">Reverse proxy</text><text x="447" y="242" class="name" text-anchor="middle">Caddy / nginx</text><text x="447" y="280" class="small" text-anchor="middle">Terminates TLS</text><rect x="715" y="166" width="222" height="144" rx="12" class="card"/><text x="826" y="204" class="label" text-anchor="middle">Docker container</text><text x="826" y="242" class="name" text-anchor="middle">Bridge</text><text x="826" y="280" class="body" text-anchor="middle">Page + API</text><path d="M255 240 H321" class="wire" marker-end="url(#arrow)"/><text x="288" y="220" class="small" text-anchor="middle">HTTPS</text><path d="M573 240 H706" class="wire" marker-end="url(#arrow)"/><text x="640" y="213" class="small" text-anchor="middle">HTTP</text><text x="640" y="272" class="small" text-anchor="middle">127.0.0.1:8787</text><text x="36" y="396" class="body" text-anchor="start">Forward all paths, preserve Host and disable response buffering for live status.</text><text x="36" y="430" class="sub" text-anchor="start">Management access shown here. Remote-control connections also communicate with OpenAI.</text></svg>
