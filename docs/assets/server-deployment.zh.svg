<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">服务器部署：管理页面的访问路径</title><desc id="desc">浏览器通过 HTTPS 访问宿主机的 Caddy 或 nginx，反代终止 TLS，再通过宿主机 127.0.0.1:8787 将 HTTP 转发到桥接容器。桥接容器不申请证书。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1e2a33}.title{font-size:30px;font-weight:650}.sub{font-size:18px;fill:#5b6b77}.label{font-size:16px;font-weight:600;fill:#236778}.name{font-size:25px;font-weight:600}.body{font-size:18px}.small{font-size:14px;fill:#5b6b77}.pill{font-size:16px;fill:#236778}.card{fill:white;stroke:#d8e0e5;stroke-width:1.5}.wire{fill:none;stroke:#236778;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236778"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f7f8"/><text x="36" y="49" class="title" text-anchor="start">服务器部署：管理页面的访问路径</text><text x="36" y="80" class="sub" text-anchor="start">HTTPS 和证书由宿主机反向代理管理。</text><rect x="300" y="111" width="664" height="243" rx="12" fill="#eaf0f3"/><text x="324" y="141" class="label" text-anchor="start">你的服务器宿主机</text><rect x="36" y="166" width="213" height="144" rx="12" class="card"/><text x="142" y="210" class="name" text-anchor="middle">浏览器</text><text x="142" y="247" class="body" text-anchor="middle">管理页面</text><text x="142" y="280" class="small" text-anchor="middle">bridge.example.com</text><rect x="330" y="166" width="235" height="144" rx="12" class="card"/><text x="447" y="204" class="label" text-anchor="middle">反向代理</text><text x="447" y="242" class="name" text-anchor="middle">Caddy / nginx</text><text x="447" y="280" class="small" text-anchor="middle">终止 TLS</text><rect x="715" y="166" width="222" height="144" rx="12" class="card"/><text x="826" y="204" class="label" text-anchor="middle">Docker 容器</text><text x="826" y="242" class="name" text-anchor="middle">Bridge</text><text x="826" y="280" class="body" text-anchor="middle">页面 + API</text><path d="M255 240 H321" class="wire" marker-end="url(#arrow)"/><text x="288" y="220" class="small" text-anchor="middle">HTTPS</text><path d="M573 240 H706" class="wire" marker-end="url(#arrow)"/><text x="640" y="213" class="small" text-anchor="middle">HTTP</text><text x="640" y="272" class="small" text-anchor="middle">127.0.0.1:8787</text><text x="36" y="396" class="body" text-anchor="start">所有路径都转发；保留 Host，关闭响应缓冲以支持实时状态。</text><text x="36" y="430" class="sub" text-anchor="start">此图只展示管理页面；桥接的远控连接另外与 OpenAI 通信。</text></svg>
