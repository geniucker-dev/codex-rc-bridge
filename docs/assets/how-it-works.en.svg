<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" role="img" aria-labelledby="title desc"><title id="title">Remote control across accounts</title><desc id="desc">ChatGPT on account A connects through OpenAI to the bridge, which connects through OpenAI to Codex on account B. The bridge runs on a Mac or a separate server.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1e2a33}.title{font-size:30px;font-weight:650}.sub{font-size:18px;fill:#5b6b77}.label{font-size:16px;font-weight:600;fill:#236778}.name{font-size:25px;font-weight:600}.body{font-size:18px}.small{font-size:14px;fill:#5b6b77}.pill{font-size:16px;fill:#236778}.card{fill:white;stroke:#d8e0e5;stroke-width:1.5}.wire{fill:none;stroke:#236778;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236778"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f7f8"/><text x="40" y="51" class="title" text-anchor="start">Remote control across accounts</text><text x="40" y="83" class="sub" text-anchor="start">Pair your devices in the bridge, then connect the two sides.</text><rect x="40" y="119" width="270" height="200" rx="12" class="card"/><rect x="415" y="119" width="270" height="200" rx="12" class="card"/><rect x="790" y="119" width="270" height="200" rx="12" class="card"/><text x="64" y="153" class="label" text-anchor="start">Controller</text><text x="64" y="194" class="name" text-anchor="start">ChatGPT</text><text x="64" y="227" class="body" text-anchor="start">Phone, tablet or computer</text><rect x="64" y="253" width="222" height="40" rx="12" fill="#edf5f7"/><text x="175" y="279" class="pill" text-anchor="middle">ChatGPT account A</text><text x="439" y="153" class="label" text-anchor="start">Bridge</text><text x="550" y="197" class="name" text-anchor="middle">Codex RC Bridge</text><text x="550" y="231" class="body" text-anchor="middle">Relays remote control</text><text x="550" y="279" class="small" text-anchor="middle">macOS app / your server</text><text x="814" y="153" class="label" text-anchor="start">Controlled device</text><text x="814" y="194" class="name" text-anchor="start">Codex</text><text x="814" y="227" class="body" text-anchor="start">Remote control enabled</text><rect x="814" y="253" width="222" height="40" rx="12" fill="#edf5f7"/><text x="925" y="279" class="pill" text-anchor="middle">ChatGPT account B</text><path d="M320 225 H405" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="362.5" y="193" class="small" text-anchor="middle">via OpenAI</text><path d="M695 225 H780" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="737.5" y="193" class="small" text-anchor="middle">via OpenAI</text><text x="40" y="365" class="body" text-anchor="start">Keep the bridge and Codex running.</text><text x="40" y="394" class="sub" text-anchor="start">Your controller only needs ChatGPT. The desktop bridge can run on the same Mac as Codex.</text></svg>
