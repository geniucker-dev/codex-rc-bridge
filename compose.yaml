name: codex-rc-bridge
x-server: &server
  # Release copies pin their own version here; BRIDGE_IMAGE selects another image, such as a local build.
  image: ${BRIDGE_IMAGE:-geniucker/codex-rc-bridge:latest}
  environment:
    - BRIDGE_UPSTREAM_PROXY
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  server:
    <<: *server
    environment:
      - BRIDGE_PUBLIC_ORIGIN=${BRIDGE_PUBLIC_ORIGIN:?Set the public browser origin}
      - BRIDGE_UPSTREAM_PROXY
    # Plain HTTP for the reverse proxy on this host, which terminates TLS.
    ports:
      - "${BRIDGE_HTTP_BIND:-127.0.0.1}:${BRIDGE_HTTP_PORT:-8787}:8787"
    volumes:
      - bridge-data:/var/lib/bridge
      - bridge-key:/run/bridge-secrets:ro
    restart: unless-stopped
    stop_grace_period: 2m
  admin:
    <<: *server
    profiles: [setup]
    entrypoint:
      [
        bridge-admin,
        /var/lib/bridge/bridge.sqlite,
        /run/bridge-secrets/master.key,
      ]
    volumes:
      - bridge-data:/var/lib/bridge
      - bridge-key:/run/bridge-secrets
volumes:
  bridge-data:
  bridge-key:
